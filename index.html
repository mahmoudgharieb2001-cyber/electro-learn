<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1f3a" />
  <meta name="description" content="أكاديمية التدريب المهني - منصة تعليمية هندسية متكاملة" />
  <title>أكاديمية التدريب المهني</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#0b1f3a;--primary-2:#12345d;--accent:#1d78f2;--accent-2:#0ea5e9;
      --bg:#f5f7fb;--surface:#fff;--surface-2:#eef3f9;--text:#172033;--muted:#68758a;
      --border:#e3e9f2;--success:#159957;--danger:#dc3545;--warning:#d68b00;
      --shadow:0 12px 35px rgba(11,31,58,.08);--radius:18px;--sidebar:270px;
    }
    [data-theme="dark"]{
      --bg:#07111f;--surface:#0d1b2c;--surface-2:#13263d;--text:#edf4ff;--muted:#9db0c8;
      --border:#20344d;--shadow:0 15px 40px rgba(0,0,0,.25);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Tajawal,sans-serif;line-height:1.7}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .sidebar{position:fixed;right:0;top:0;width:var(--sidebar);height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:30;padding:22px 16px;overflow:auto}
    .brand{display:flex;align-items:center;gap:12px;padding:8px 10px 22px}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--primary));color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
    .brand h1{font-size:16px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px}
    .nav-title{font-size:11px;color:var(--muted);font-weight:700;padding:12px 12px 7px}
    .nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:0;background:transparent;color:var(--muted);border-radius:12px;text-align:right;margin:3px 0}
    .nav-item:hover,.nav-item.active{background:var(--surface-2);color:var(--accent);font-weight:700}
    .nav-item span:first-child{width:23px;text-align:center}
    .main{margin-right:var(--sidebar);min-height:100vh}
    .topbar{position:sticky;top:0;z-index:20;height:72px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 28px}
    .menu-btn{display:none;border:0;background:var(--surface-2);color:var(--text);width:42px;height:42px;border-radius:12px}
    .search{flex:1;max-width:620px;position:relative}
    .search input{width:100%;height:44px;border:1px solid var(--border);background:var(--surface-2);border-radius:13px;padding:0 44px 0 14px;color:var(--text);outline:none}
    .search span{position:absolute;right:14px;top:7px}
    .top-actions{margin-right:auto;display:flex;gap:8px;align-items:center}
    .icon-btn{border:1px solid var(--border);background:var(--surface);color:var(--text);width:42px;height:42px;border-radius:12px}
    .user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px;border:1px solid var(--border);border-radius:13px;background:var(--surface)}
    .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
    .content{padding:28px;max-width:1600px;margin:auto}
    .view{display:none}.view.active{display:block}
    .hero{background:linear-gradient(135deg,#081b34 0%,#123a68 60%,#1469ba 100%);color:#fff;border-radius:24px;padding:36px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
    .hero:after{content:"";position:absolute;width:320px;height:320px;border:55px solid rgba(255,255,255,.06);border-radius:50%;left:-80px;bottom:-180px}
    .hero-content{position:relative;z-index:1;max-width:760px}.hero h2{font-size:clamp(25px,4vw,42px);line-height:1.25;margin:0 0 12px}.hero p{color:#d9e7f7;margin:0 0 22px}
    .btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:var(--accent);color:#fff}.btn-light{background:#fff;color:#0b1f3a}.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}.btn-danger{background:#fff0f1;color:var(--danger)}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 14px}.section-head h3{margin:0;font-size:20px}.section-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
    .ticker{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);padding:10px 14px;border-radius:13px;margin:14px 0;overflow:hidden}.ticker strong{color:var(--accent);white-space:nowrap}.ticker-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .grid{display:grid;gap:16px}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
    .card-body{padding:18px}.card h4{margin:0 0 7px;font-size:17px}.muted{color:var(--muted);font-size:13px}
    .course-card{display:flex;flex-direction:column;height:100%}.course-cover{height:145px;background:linear-gradient(135deg,#102d50,#1976d2);color:#fff;padding:17px;display:flex;align-items:flex-end;font-weight:800;font-size:19px;position:relative}.course-cover small{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.16);padding:4px 8px;border-radius:8px;font-size:10px}
    .course-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{font-size:11px;background:var(--surface-2);padding:4px 8px;border-radius:20px;color:var(--muted)}
    .progress{height:7px;background:var(--surface-2);border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:inherit}
    .stat{padding:18px}.stat .num{font-size:27px;font-weight:800;margin-top:6px}.stat .icon{font-size:22px}
    .job-card,.news-card,.offer-card{padding:18px}.job-card .top,.news-card .top{display:flex;justify-content:space-between;gap:10px}.tag{font-size:10px;padding:4px 8px;border-radius:8px;background:#e9f2ff;color:#1766c2}.dark-tag{background:var(--surface-2);color:var(--muted)}
    .empty{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed var(--border);border-radius:16px}
    .page-title{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.page-title h2{margin:0;font-size:28px}.page-title p{margin:3px 0 0;color:var(--muted)}
    .lesson-layout{display:grid;grid-template-columns:1fr 330px;gap:18px}.video-wrap{aspect-ratio:16/9;background:#05080d;border-radius:18px;overflow:hidden}.video-wrap iframe{width:100%;height:100%;border:0}.pdf-wrap{width:100%;height:70vh;border:0;border-radius:15px}
    .list{display:grid;gap:8px}.lesson-row{display:flex;align-items:center;gap:10px;padding:11px;border-radius:11px;background:var(--surface-2);cursor:pointer}.lesson-row.active{outline:2px solid var(--accent)}.lesson-row .check{margin-right:auto}
    .tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.tab{border:1px solid var(--border);background:var(--surface);color:var(--muted);padding:9px 13px;border-radius:10px;white-space:nowrap}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px;border-bottom:1px solid var(--border);text-align:right}.table th{color:var(--muted);font-size:12px}
    .admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.admin-tile{padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--surface);cursor:pointer}.admin-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.admin-tile strong{display:block;font-size:18px;margin-top:8px}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px;border:1px solid var(--border);box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:11px;padding:10px 12px;outline:none}.field textarea{min-height:110px;resize:vertical}.modal-foot{padding:15px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-start;gap:8px}
    .toast{position:fixed;bottom:22px;left:22px;z-index:200;background:var(--primary);color:#fff;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);display:none}.toast.show{display:block}
    .auth-screen{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top left,#dcecff,transparent 40%),var(--bg)}.auth-box{width:min(450px,100%);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow)}.auth-logo{display:grid;place-items:center;margin-bottom:18px}.auth-box h2{margin:0 0 5px}.auth-box p{color:var(--muted);margin-top:0}.auth-tabs{display:flex;gap:5px;background:var(--surface-2);padding:4px;border-radius:12px;margin:18px 0}.auth-tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;color:var(--muted)}.auth-tabs button.active{background:var(--surface);color:var(--accent);font-weight:800}
    .bottom-nav{display:none}
    .overlay{display:none}
    .footer{padding:35px 0 15px;color:var(--muted);font-size:12px;text-align:center}
    @media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3,.admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-layout{grid-template-columns:1fr}}
    @media(max-width:800px){
      :root{--sidebar:0px}.sidebar{transform:translateX(110%);transition:.25s;width:min(300px,85vw);box-shadow:-20px 0 50px rgba(0,0,0,.15)}body.sidebar-open .sidebar{transform:translateX(0)}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}.overlay.show{display:block}
      .main{margin-right:0}.topbar{padding:0 14px;height:64px}.menu-btn{display:block}.search{max-width:none}.top-actions .hide-mobile{display:none}.user-chip strong{display:none}.content{padding:18px 14px 85px}.hero{padding:26px 20px;border-radius:20px}.hero h2{font-size:28px}.grid-4,.grid-3,.grid-2,.admin-grid{grid-template-columns:1fr}.section-head{margin-top:22px}.bottom-nav{display:flex;position:fixed;bottom:0;right:0;left:0;height:64px;background:var(--surface);border-top:1px solid var(--border);z-index:24;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.bottom-nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:10px}.bottom-nav button.active{color:var(--accent);font-weight:800}.page-title{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.course-cover{height:125px}.pdf-wrap{height:60vh}}
    @media(max-width:430px){.topbar .search input{padding-right:36px}.topbar .search span{right:10px}.top-actions{gap:4px}.icon-btn{width:38px;height:38px}.hero p{font-size:13px}.btn{width:100%}.hero .btn{margin-top:5px}.card-body{padding:15px}}
  </style>
</head>

<body>
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="brand-mark">أ</div>
    </div>
    <h2>أكاديمية التدريب المهني</h2>
    <p>منصة هندسية للتعلم العملي والتطوير المهني</p>
    <div class="auth-tabs">
      <button id="loginTab" class="active" onclick="switchAuth('login')">تسجيل الدخول</button>
      <button id="registerTab" onclick="switchAuth('register')">إنشاء حساب</button>
    </div>
    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="field" style="margin-bottom:12px">
        <label>البريد الإلكتروني</label>
        <input id="authEmail" type="email" required autocomplete="email">
      </div>
      <div class="field" style="margin-bottom:12px">
        <label>كلمة المرور</label>
        <input id="authPassword" type="password" required minlength="6" autocomplete="current-password">
      </div>
      <div id="nameField" class="field hidden" style="margin-bottom:12px">
        <label>الاسم</label>
        <input id="authName" type="text">
      </div>
      <button class="btn btn-primary" style="width:100%" id="authSubmit">دخول إلى الأكاديمية</button>
    </form>
    <button class="btn btn-ghost" style="width:100%;margin-top:9px" onclick="resetPassword()">نسيت كلمة المرور؟</button>
    <div id="authError" class="muted" style="margin-top:12px;color:var(--danger)"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">أ</div>
      <div><h1>أكاديمية التدريب المهني</h1><small>Professional Engineering Academy</small></div>
    </div>
    <div class="nav-title">الرئيسية</div>
    <button class="nav-item active" data-view="home" onclick="navigate('home')"><span>⌂</span><span>الرئيسية</span></button>
    <button class="nav-item" data-view="courses" onclick="navigate('courses')"><span>▣</span><span>الكورسات</span></button>
    <button class="nav-item" data-view="categories" onclick="navigate('categories')"><span>◈</span><span>التخصصات</span></button>
    <button class="nav-item" data-view="library" onclick="navigate('library')"><span>▤</span><span>المكتبة الهندسية</span></button>
    <button class="nav-item" data-view="jobs" onclick="navigate('jobs')"><span>▥</span><span>الوظائف</span></button>
    <button class="nav-item" data-view="news" onclick="navigate('news')"><span>◉</span><span>الأخبار</span></button>
    <div class="nav-title">حسابي</div>
    <button class="nav-item" data-view="dashboard" onclick="navigate('dashboard')"><span>◌</span><span>لوحتي</span></button>
    <button class="nav-item" data-view="bookmarks" onclick="navigate('bookmarks')"><span>☆</span><span>المحفوظات</span></button>
    <button id="adminNav" class="nav-item hidden" data-view="admin" onclick="navigate('admin')"><span>⚙</span><span>لوحة الإدارة</span></button>
    <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:14px">
      <button class="nav-item" onclick="toggleTheme()"><span>☾</span><span>الوضع الليلي / النهاري</span></button>
      <button class="nav-item" onclick="logout()"><span>↪</span><span>تسجيل الخروج</span></button>
    </div>
  </aside>
  <div id="overlay" class="overlay" onclick="closeSidebar()"></div>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="search"><span>⌕</span><input id="globalSearch" placeholder="ابحث عن كورس أو ملف أو وظيفة..." oninput="globalSearch(this.value)"></div>
      <div class="top-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="الوضع الليلي">☼</button>
        <button class="icon-btn" onclick="navigate('dashboard')" title="الحساب">◉</button>
        <div class="user-chip"><div class="avatar" id="topAvatar">م</div><strong id="topName">المستخدم</strong></div>
      </div>
    </header>

    <section class="content">
      <div id="view-home" class="view active"></div>
      <div id="view-courses" class="view"></div>
      <div id="view-categories" class="view"></div>
      <div id="view-library" class="view"></div>
      <div id="view-jobs" class="view"></div>
      <div id="view-news" class="view"></div>
      <div id="view-dashboard" class="view"></div>
      <div id="view-bookmarks" class="view"></div>
      <div id="view-admin" class="view"></div>
      <div id="view-lesson" class="view"></div>
      <div class="footer">© <span id="year"></span> أكاديمية التدريب المهني — منصة تعليمية هندسية</div>
    </section>
  </main>
  <nav class="bottom-nav">
    <button data-view="home" onclick="navigate('home')">⌂<br>الرئيسية</button>
    <button data-view="courses" onclick="navigate('courses')">▣<br>الكورسات</button>
    <button data-view="library" onclick="navigate('library')">▤<br>المكتبة</button>
    <button data-view="dashboard" onclick="navigate('dashboard')">◉<br>حسابي</button>
  </nav>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><strong id="modalTitle">إضافة</strong><button class="icon-btn" onclick="closeModal()">×</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalFoot" class="modal-foot"></div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
  import {
    getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
    sendPasswordResetEmail, onAuthStateChanged, signOut, updateProfile
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc,
    deleteDoc, query, where, orderBy, limit, onSnapshot, serverTimestamp,
    increment
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAxVTZm4ytoFrZ91qeaGJ8MPkP7T1t6j_g",
    authDomain: "acadmya.firebaseapp.com",
    projectId: "acadmya",
    storageBucket: "acadmya.firebasestorage.app",
    messagingSenderId: "89992811511",
    appId: "1:89992811511:web:41ad04c620b5df046554f2"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const state = {
    user:null, profile:null, role:"user", view:"home", authMode:"login",
    data:{categories:[],courses:[],modules:[],lessons:[],library:[],jobs:[],news:[],offers:[],breakingNews:[],banners:[]},
    currentCourse:null, currentLesson:null, unsub:null
  };

  const collections = ["categories","courses","modules","lessons","library","jobs","news","offers","breakingNews","banners","notifications"];
  const labels = {categories:"التخصصات",courses:"الكورسات",modules:"الوحدات",lessons:"الدروس",library:"المكتبة",jobs:"الوظائف",news:"الأخبار",offers:"العروض",breakingNews:"شريط الأخبار",banners:"البانرات",notifications:"الإشعارات"};

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  const slug = s => String(s||"").toLowerCase().trim().replace(/\s+/g,"-");
  const initials = s => (String(s||"م").trim()[0]||"م");
  const fmtDate = v => { try { return v?.toDate ? v.toDate().toLocaleDateString("ar-EG") : new Date(v).toLocaleDateString("ar-EG"); } catch{return ""} };
  const show = id => $(id)?.classList.remove("hidden");
  const hide = id => $(id)?.classList.add("hidden");

  function toast(msg, type="ok"){ const t=$("toast"); t.textContent=msg; t.style.background=type==="error"?"var(--danger)":type==="warn"?"var(--warning)":"var(--primary)"; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2800); }

  window.switchAuth = mode => {
    state.authMode=mode;
    $("loginTab").classList.toggle("active",mode==="login"); $("registerTab").classList.toggle("active",mode==="register");
    $("nameField").classList.toggle("hidden",mode==="login"); $("authSubmit").textContent=mode==="login"?"دخول إلى الأكاديمية":"إنشاء الحساب";
    $("authError").textContent="";
  };

  window.handleAuth = async e => {
    e.preventDefault(); $("authError").textContent="";
    const email=$("authEmail").value.trim(), pass=$("authPassword").value, name=$("authName").value.trim();
    try{
      if(state.authMode==="register"){
        const cred=await createUserWithEmailAndPassword(auth,email,pass);
        if(name) await updateProfile(cred.user,{displayName:name});
        await setDoc(doc(db,"users",cred.user.uid),{uid:cred.user.uid,email,name:name||"مستخدم جديد",role:"user",createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:true});
        toast("تم إنشاء الحساب بنجاح");
      }else await signInWithEmailAndPassword(auth,email,pass);
    }catch(err){ $("authError").textContent=translateFirebaseError(err.code); }
  };

  window.resetPassword = async () => {
    const email=$("authEmail").value.trim();
    if(!email) return toast("اكتب بريدك الإلكتروني أولًا","warn");

  function youtubeEmbed(url){
    if(!url)return "";
    if(url.includes("/embed/"))return url;
    const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|live\/))([^?&/]+)/);
    return m?`https://www.youtube.com/embed/${m[1]}`:url;
  }
  function drivePreview(url){
    if(!url)return "";
    if(url.includes("/preview"))return url;
    const m=url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    return m?`https://drive.google.com/file/d/${m[1]}/preview`:url.replace("/view","/preview");
  }

    news:[["title","عنوان الخبر","text"],["summary","الملخص","textarea"],["url","رابط الخبر","url"],["published","منشور","checkbox"]],
    offers:[["title","عنوان العرض","text"],["description","الوصف","textarea"],["price","السعر/التفاصيل","text"],["url","الرابط","url"],["published","منشور","checkbox"]],
    breakingNews:[["title","نص الشريط","text"],["url","الرابط","url"],["published","منشور","checkbox"]],
    banners:[["title","عنوان البانر","text"],["description","الوصف","textarea"],["image","رابط الصورة","url"],["color","خلفية CSS اختيارية","text"],["published","منشور","checkbox"]],
    notifications:[["title","العنوان","text"],["body","النص","textarea"],["published","منشور","checkbox"]]
  };

  window.openEditor=(c,id="")=>{
    const item=id?(state.data[c]||[]).find(x=>x.id===id)||{}:{};
    const defs=fieldDefs[c]||[["name","الاسم","text"]];
    $("modalTitle").textContent=id?`تعديل ${labels[c]||c}`:`إضافة ${labels[c]||c}`;
    $("modalBody").innerHTML=`<form id="editorForm" class="form-grid">${defs.map(([key,label,type])=>{
      let v=item[key]??(key==="published"?true:"");
      if(type==="textarea")return `<div class="field full"><label>${label}</label><textarea name="${key}">${esc(v)}</textarea></div>`;
      if(type==="checkbox")return `<div class="field full"><label><input name="${key}" type="checkbox" ${v!==false?"checked":""}> ${label}</label></div>`;
      if(type==="selectCategory")return `<div class="field"><label>${label}</label><select name="${key}"><option value="">اختر</option>${state.data.categories.map(x=>`<option value="${x.id}" ${v===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`;
      if(type==="selectCourse")return `<div class="field"><label>${label}</label><select name="${key}"><option value="">اختر</option>${state.data.courses.map(x=>`<option value="${x.id}" ${v===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`;
      if(type==="selectModule")return `<div class="field"><label>${label}</label><select name="${key}"><option value="">اختر</option>${state.data.modules.map(x=>`<option value="${x.id}" ${v===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>`;
      if(type==="selectType")return `<div class="field"><label>${label}</label><select name="${key}"><option value="video" ${v==="video"?"selected":""}>فيديو</option><option value="pdf" ${v==="pdf"?"selected":""}>PDF</option></select></div>`;
      return `<div class="field"><label>${label}</label><input name="${key}" type="${type}" value="${esc(v)}"></div>`;
    }).join("")}</form>`;
    $("modalFoot").innerHTML=`<button class="btn btn-primary" onclick="saveEditor('${c}','${id}')">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>`;
    $("modalBackdrop").classList.add("open");
  };

  window.saveEditor=async(c,id)=>{
    const form=$("editorForm");const data={};
    for(const el of form.elements){if(!el.name)continue;data[el.name]=el.type==="checkbox"?el.checked:el.type==="number"?Number(el.value||0):el.value.trim();}
    data.updatedAt=serverTimestamp(); if(!id)data.createdAt=serverTimestamp();
    try{if(id)await updateDoc(doc(db,c,id),data);else await addDoc(collection(db,c),data);closeModal();toast("تم حفظ البيانات");await loadAllData();adminCollection(c);}
    catch(e){toast("تعذر الحفظ: "+e.message,"error")}
  };
  window.removeItem=async(c,id)=>{
    if(!confirm("هل أنت متأكد من حذف هذا العنصر؟"))return;
    try{await deleteDoc(doc(db,c,id));toast("تم الحذف");await loadAllData();adminCollection(c)}catch(e){toast("تعذر الحذف","error")}
  };
  window.closeModal=()=>{$("modalBackdrop").classList.remove("open")};

  renderShell();
</script>
</body>
</html>
